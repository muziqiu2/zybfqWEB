<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>直链搜 · TVBox 资源直链</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23ffb02e'/%3E%3Cpath d='M12 9l12 7-12 7z' fill='%230b0b0e'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="glow" aria-hidden="true"></div>
<div class="scan" aria-hidden="true"></div>

<header>
  <div class="brand">
    <span class="brand-mark">▶</span>
    <div class="brand-txt">
      <b>直链搜</b>
      <i>TVBOX&nbsp;·&nbsp;SEARCH&nbsp;·&nbsp;DIRECT&nbsp;LINK</i>
    </div>
  </div>
  <div class="cfg-row">
    <input id="cfgUrl" type="url" spellcheck="false" placeholder="粘贴 TVBox 配置接口地址（JSON / 多仓 txt）">
    <button id="btnLoad" class="btn acc">加载配置</button>
    <button id="btnDemo" class="btn ghost" title="内置的可搜索示例配置（CMS 源）">示例配置</button>
  </div>
  <div id="cfgInfo" class="cfg-info" hidden></div>
</header>

<nav id="tabs" hidden>
  <button class="tab on" data-tab="search">搜资源</button>
  <button class="tab" data-tab="live" id="tabLive">直播</button>
  <button class="tab" data-tab="wh" id="tabWh">多仓</button>
</nav>

<main>
  <section id="panel-search" class="panel">
    <aside class="side">
      <div class="side-head">
        <span>视频源</span>
        <span id="siteStat" class="mono dim"></span>
      </div>
      <div class="side-acts">
        <button id="btnAll" class="btn ghost sm">全选</button>
        <button id="btnNone" class="btn ghost sm">清空</button>
        <input id="siteFilter" class="ipt sm" placeholder="筛选源名">
      </div>
      <div id="siteList" class="site-list"><div class="empty">加载配置后显示可用源</div></div>
      <details id="unsBox" class="uns" hidden>
        <summary><span id="unsCount">0</span> 个爬虫/JS 源不支持（B站源已内置支持）</summary>
        <div id="unsList"></div>
      </details>
    </aside>
    <div class="res">
      <div class="search-row">
        <input id="kw" class="ipt" placeholder="输入片名，回车搜索（如：庆余年 / 三体 / 流浪地球）">
        <button id="btnSearch" class="btn acc">搜 索</button>
      </div>
      <div id="statusBar" class="status-bar mono" hidden></div>
      <div id="results" class="results"></div>
    </div>
  </section>

  <section id="panel-live" class="panel" hidden>
    <div class="live-head">
      <span class="side-head-txt">直播频道</span>
      <select id="liveSrc" class="ipt sm"></select>
    </div>
    <div id="liveWrap" class="live-wrap"><div class="empty">加载直播源中…</div></div>
  </section>

  <section id="panel-wh" class="panel" hidden>
    <div id="whList" class="wh-list"></div>
  </section>
</main>

<div id="modal" class="modal" hidden>
  <div class="modal-box">
    <button id="mClose" class="m-close" title="关闭">✕</button>
    <div class="m-meta">
      <img id="mPic" class="m-pic" hidden alt="">
      <div class="m-info">
        <h3 id="mTitle">—</h3>
        <div id="mSub" class="dim mono"></div>
      </div>
    </div>
    <div class="direct-row">
      <input id="mUrl" class="ipt mono" readonly placeholder="点击剧集获取视频直链">
      <button id="mCopy" class="btn ghost">复制直链</button>
      <button id="mCopyAll" class="btn ghost">复制全部</button>
    </div>
    <div id="mHint" class="r-hint mono dim" hidden></div>
    <div id="mRoutes" class="routes" hidden></div>
    <div id="mEps" class="eps"></div>
  </div>
</div>

<div id="toast" class="toast mono" hidden></div>

<script src="/app.js"></script>
</body>
</html>
